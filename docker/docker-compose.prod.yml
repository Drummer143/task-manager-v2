name: task-manager

# Shared by authentik_server and authentik_worker. The AUTHENTIK_SLUG, AUTHENTIK_CLIENT_ID,
# AUTHENTIK_REDIRECT_URI* and AUTHENTIK_NOTIFICATION_WEBHOOK_USER_SYNC values are not authentik
# settings: the blueprints in ./authentik/blueprints read them via !Env.
x-authentik-env: &authentik-env
    AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?AUTHENTIK_SECRET_KEY is required}
    AUTHENTIK_ALLOWED_HOSTS: "localhost,authentik_server,auth.${DOMAIN}"
    AUTHENTIK_POSTGRESQL__HOST: postgres
    AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER:?AUTHENTIK_DB_USER is required}
    AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME:?AUTHENTIK_DB_NAME is required}
    AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:?AUTHENTIK_DB_PASSWORD is required}
    AUTHENTIK_SLUG: ${AUTHENTIK_SLUG:?AUTHENTIK_SLUG is required}
    AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:?AUTHENTIK_CLIENT_ID is required}
    AUTHENTIK_REDIRECT_URI: ${AUTHENTIK_REDIRECT_URI:?AUTHENTIK_REDIRECT_URI is required}
    AUTHENTIK_REDIRECT_URI_SILENT: ${AUTHENTIK_REDIRECT_URI_SILENT:?AUTHENTIK_REDIRECT_URI_SILENT is required}
    AUTHENTIK_REDIRECT_URI_2: ${AUTHENTIK_REDIRECT_URI_2:?AUTHENTIK_REDIRECT_URI_2 is required}
    AUTHENTIK_REDIRECT_URI_2_SILENT: ${AUTHENTIK_REDIRECT_URI_2_SILENT:?AUTHENTIK_REDIRECT_URI_2_SILENT is required}
    # Where authentik may send the browser after sign-out (the frontend's /login)
    AUTHENTIK_POST_LOGOUT_REDIRECT_URI: ${AUTHENTIK_POST_LOGOUT_REDIRECT_URI:?AUTHENTIK_POST_LOGOUT_REDIRECT_URI is required}
    AUTHENTIK_POST_LOGOUT_REDIRECT_URI_2: ${AUTHENTIK_POST_LOGOUT_REDIRECT_URI_2:?AUTHENTIK_POST_LOGOUT_REDIRECT_URI_2 is required}
    AUTHENTIK_NOTIFICATION_WEBHOOK_USER_SYNC: ${AUTHENTIK_NOTIFICATION_WEBHOOK_USER_SYNC:?AUTHENTIK_NOTIFICATION_WEBHOOK_USER_SYNC is required}
    # Sent by the user sync webhook to main-service (the blueprint's headers mapping)
    USER_SYNC_WEBHOOK_TOKEN: ${USER_SYNC_WEBHOOK_TOKEN:?USER_SYNC_WEBHOOK_TOKEN is required}

x-authentik-depends-on: &authentik-depends-on
    postgres:
        condition: service_healthy
    postgres-init:
        condition: service_completed_successfully

services:
    caddy:
        image: caddy:2-alpine
        restart: unless-stopped
        container_name: caddy
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        environment:
            DOMAIN: ${DOMAIN:?DOMAIN is required}
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        networks:
            - net
        depends_on:
            - task-manager
            - main-service
            - socket-service
            - storage-service
            - authentik_server

    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        container_name: postgres
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
            interval: 10s
            timeout: 5s
            retries: 10
        deploy:
            resources:
                limits:
                    memory: 512M
                    cpus: "0.5"
        environment:
            POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
            POSTGRES_DB: ${POSTGRES_DB_NAME:?POSTGRES_DB_NAME is required}
        ports:
            - "127.0.0.1:5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - net

    # One-shot job: creates the authentik role and database on the shared postgres.
    # Values come from the environment ($$ = resolved inside the container), so the
    # password never ends up in the container command line.
    postgres-init:
        image: postgres:16-alpine
        container_name: postgres-init
        restart: "no"
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - net
        environment:
            PGHOST: postgres
            PGUSER: ${POSTGRES_USER}
            PGPASSWORD: ${POSTGRES_PASSWORD}
            PGDATABASE: ${POSTGRES_DB_NAME}
            NEW_DB: ${AUTHENTIK_DB_NAME}
            NEW_USER: ${AUTHENTIK_DB_USER}
            NEW_PASS: ${AUTHENTIK_DB_PASSWORD}
        command:
            - sh
            - -ec
            - |
                echo 'Ensuring authentik role...'
                psql -v ON_ERROR_STOP=1 -v u="$$NEW_USER" -v p="$$NEW_PASS" <<'SQL'
                SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'u', :'p')
                WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'u')\gexec
                SQL

                echo 'Ensuring authentik database...'
                psql -v ON_ERROR_STOP=1 -v u="$$NEW_USER" -v d="$$NEW_DB" <<'SQL'
                SELECT format('CREATE DATABASE %I OWNER %I', :'d', :'u')
                WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'d')\gexec
                SELECT format('GRANT ALL PRIVILEGES ON DATABASE %I TO %I', :'d', :'u')\gexec
                SQL

                echo 'Authentik DB init complete'

    rmq:
        image: rabbitmq:management-alpine
        restart: unless-stopped
        container_name: rmq
        # Loopback only, like postgres and redis: reachable through scripts/tunnel.ps1, not from outside
        ports:
            - "127.0.0.1:5672:5672"
        # A port probe, not `rabbitmq-diagnostics`: the CLI boots its own Erlang VM, which takes over
        # 10 s within the CPU limit below and so kept failing the timeout. The AMQP listener opens only
        # once the broker has finished booting, so an open port means it is ready.
        healthcheck:
            test: ["CMD", "nc", "-z", "127.0.0.1", "5672"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 60s
        deploy:
            resources:
                limits:
                    memory: 256M
                    cpus: "0.5"
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
        networks:
            - net
        volumes:
            - rmqdata:/var/lib/rabbitmq

    # Upload transactions of storage-service. Persisted so unfinished uploads survive a restart.
    redis:
        image: redis:7-alpine
        restart: unless-stopped
        container_name: redis
        command: ["redis-server", "--appendonly", "yes"]
        # Loopback only: reachable from the VPS itself, which is what the SSH tunnel uses
        ports:
            - "127.0.0.1:6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 10
        deploy:
            resources:
                limits:
                    memory: 128M
                    cpus: "0.25"
        networks:
            - net
        volumes:
            - redisdata:/data

    authentik_server:
        image: ghcr.io/goauthentik/server:2026.8.3
        restart: unless-stopped
        container_name: authentik_server
        command: server
        shm_size: 512mb
        deploy:
            resources:
                limits:
                    memory: 1G
                    cpus: "1.0"
        environment: *authentik-env
        ports:
            - "127.0.0.1:9000:9000"
        volumes:
            - authentik_data:/data
            - authentik_templates:/templates
            - ./authentik/blueprints:/blueprints/custom:ro
        depends_on: *authentik-depends-on
        networks:
            - net

    authentik_worker:
        image: ghcr.io/goauthentik/server:2026.8.3
        restart: unless-stopped
        container_name: authentik_worker
        command: worker
        shm_size: 512mb
        # root is needed to use the docker socket for managed outposts
        user: root
        deploy:
            resources:
                limits:
                    memory: 1G
                    cpus: "1.0"
        environment: *authentik-env
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - authentik_data:/data
            - authentik_templates:/templates
            - ./authentik/blueprints:/blueprints/custom:ro
        depends_on: *authentik-depends-on
        networks:
            - net

    task-manager:
        restart: unless-stopped
        container_name: task-manager
        image: ghcr.io/drummer143/task-manager-v2/task-manager:${IMAGE_TAG:-latest}
        build:
            context: ..
            dockerfile: docker/Dockerfile.frontend
            args:
                VITE_AUTHORITY: ${VITE_AUTHORITY:-}
                VITE_CLIENT_ID: ${VITE_CLIENT_ID:-}
                VITE_API_URL: ${VITE_API_URL:-}
        deploy:
            resources:
                limits:
                    memory: 48M
                    cpus: "0.25"
        networks:
            - net

    # REST backend; applies database migrations on startup before serving.
    # Served by caddy on api.{$DOMAIN}; /internal/* is reachable from this network only
    main-service:
        restart: unless-stopped
        container_name: main-service
        image: ghcr.io/drummer143/task-manager-v2/main-service:${IMAGE_TAG:-latest}
        build:
            context: ..
            dockerfile: docker/Dockerfile.rust
            args:
                APP_NAME: main_service
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
            # authentik must send it with the user sync webhook
            USER_SYNC_WEBHOOK_TOKEN: ${USER_SYNC_WEBHOOK_TOKEN:?USER_SYNC_WEBHOOK_TOKEN is required}
            # Access tokens from the frontend are verified against these (GET /me and the rest)
            AUTHENTIK_JWKS_URL: ${AUTHENTIK_JWKS_URL:?AUTHENTIK_JWKS_URL is required}
            AUTHENTIK_AUDIENCE: ${AUTHENTIK_AUDIENCE:?AUTHENTIK_AUDIENCE is required}
            AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER:-}
            # Port is also referenced by AUTHENTIK_NOTIFICATION_WEBHOOK_USER_SYNC
            MAIN_SERVICE_HOST: 0.0.0.0
            MAIN_SERVICE_PORT: 8080
            # The frontend (https://DOMAIN) calls api.DOMAIN cross-origin
            CORS_ORIGINS: https://${DOMAIN:?DOMAIN is required}
            AMQP_URL: ${AMQP_URL:?AMQP_URL is required}
            DEBUG_NOTIFICATIONS: true
        deploy:
            resources:
                limits:
                    memory: 128M
                    cpus: "0.5"
        networks:
            - net

    # File storage: chunked, deduplicated uploads and downloads through signed or public links.
    # Served by caddy on storage.{$DOMAIN} (only /files, /public/files, /actions and the Swagger UI
    # at /api; /internal/* is reachable from this network only). The port, 8082, is fixed in the binary and referenced by
    # STORAGE_SERVICE_URL. The blobs table is created by the migrations main-service applies on
    # startup; storage-service only starts after it, and fails requests until they are done.
    storage-service:
        restart: unless-stopped
        container_name: storage-service
        image: ghcr.io/drummer143/task-manager-v2/storage-service:${IMAGE_TAG:-latest}
        build:
            context: ..
            dockerfile: docker/Dockerfile.rust
            args:
                APP_NAME: storage
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            main-service:
                condition: service_started
            # fetches the JWKS at startup; the restart policy covers authentik still booting
            authentik_server:
                condition: service_started
        environment:
            DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
            REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
            STATIC_FOLDER_PATH: /static
            MAIN_SERVICE_URL: http://main-service:8080
            JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
            AUTHENTIK_JWKS_URL: ${AUTHENTIK_JWKS_URL:?AUTHENTIK_JWKS_URL is required}
            AUTHENTIK_AUDIENCE: ${AUTHENTIK_AUDIENCE:?AUTHENTIK_AUDIENCE is required}
            AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER:-}
            INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
            FILE_LINK_SECRET: ${FILE_LINK_SECRET:?FILE_LINK_SECRET is required}
            FILE_LINK_TTL_SECONDS: ${FILE_LINK_TTL_SECONDS:-3600}
            # e.g. STORAGE_RUST_LOG=debug while investigating; no rebuild needed
            RUST_LOG: ${STORAGE_RUST_LOG:-info,lapin=warn,sqlx=warn}
            # Links point at the public address of caddy. The frontend (https://DOMAIN) calls
            # storage cross-origin, so its origin must be allowed by CORS
            STORAGE_PUBLIC_URL: https://storage.${DOMAIN:?DOMAIN is required}
            CORS_ORIGINS: https://${DOMAIN}
        volumes:
            - storage_data:/static
        deploy:
            resources:
                limits:
                    memory: 256M
                    cpus: "1.0"
        networks:
            - net

    # Served by caddy on socket.{$DOMAIN}. The frontend connects from https://DOMAIN, another
    # origin, so it is allowed explicitly through PHX_CHECK_ORIGIN
    socket-service:
        restart: unless-stopped
        container_name: socket-service
        image: ghcr.io/drummer143/task-manager-v2/socket-service:${IMAGE_TAG:-latest}
        build:
            context: ..
            dockerfile: docker/Dockerfile.elixir
            args:
                APP_NAME: socket_service
        environment:
            SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
            PHX_HOST: socket.${DOMAIN}
            PHX_CHECK_ORIGIN: https://${DOMAIN}
            SOCKET_SERVER_PORT: 4000
            AMQP_URL: ${AMQP_URL:?AMQP_URL is required}
        deploy:
            resources:
                limits:
                    memory: 256M
                    cpus: "0.25"
        networks:
            - net

networks:
    net:

volumes:
    pgdata:
    redisdata:
    rmqdata:
    storage_data:
    caddy_data:
    caddy_config:
    authentik_data:
    authentik_templates:
