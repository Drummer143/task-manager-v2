server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip_static on;

    # Hashed build assets never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Not an SPA: the manager and the preview are real files, a story is in the query string
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
