[package]
name = "blake3_wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Incremental BLAKE3 for the browser; the same hash storage-service computes for uploads"

[lib]
# cdylib is the .wasm module; rlib lets the native tests link against it
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3 = "1.8.7"
wasm-bindgen = "0.2.129"

# SIMD is enabled per function inside blake3, so no global target features are needed.
# Every current browser supports Wasm SIMD.
[target.'cfg(target_arch = "wasm32")'.dependencies]
blake3 = { version = "1.8.7", features = ["wasm32_simd"] }

# wasm-opt rejects instructions of features it was not told about: SIMD (used by blake3) and the
# ones rustc emits by default for wasm32-unknown-unknown
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O3",
    "--enable-simd",
    "--enable-bulk-memory",
    "--enable-multivalue",
    "--enable-mutable-globals",
    "--enable-nontrapping-float-to-int",
    "--enable-reference-types",
    "--enable-sign-ext",
]
